<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KORE - The Intellectual Sanctuary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sky: {300:'#F4F0E6',400:'#EAE4D4',500:'#E4DDCB',600:'#CFC7B2',700:'#B3AB96'},
                        slate: {50:'#fafafa',100:'#f4f4f4',200:'#e5e5e5',300:'#d0d0d0',400:'#a3a3a3',500:'#737373',600:'#525252',700:'#333333',800:'#1c1c1c',900:'#0f0f0f',950:'#050505'},
                        kore: {
                            bg: '#000000',
                            card: '#0A0A0A',
                            border: '#1C1C1C',
                            accent: '#E4DDCB',
                            muted: '#94A3B8'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Font: Fraunces & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --f-serif: 'Fraunces', serif;
            --f-sans: 'Inter', sans-serif;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        body {
            font-family: var(--f-sans);
            background-color: #000000;
            color: #F8FAFC;
            overflow-x: hidden;
        }
        h1, h2, h3, .font-serif-kore {
            font-family: var(--f-serif);
        }
        [hidden] { display: none !important; }
        * {
            transition-property: background-color, border-color, color, fill, stroke, opacity, transform, box-shadow;
            transition-timing-function: var(--ease-out-expo);
            transition-duration: 0.28s;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #1C1C1C; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #333333; }

        /* Animaciones SVG y Avatares Articulados */
        .char-svg { width: 120px; height: 120px; overflow: visible; }
        .char-breathe {
            transform-origin: 60px 98px;
            animation: gentleBreathe 3.8s ease-in-out infinite;
        }
        .char-head-group {
            transform-origin: 60px 54px;
            animation: headIdleTilt 5.2s ease-in-out infinite;
            transition: transform 0.35s var(--ease-out-expo);
        }
        .char-eyelids {
            transform-origin: 60px 48px;
            animation: naturalBlink 5.4s infinite;
        }
        .char-ear-l {
            transform-origin: 34px 32px;
            animation: earTwitchL 4.6s ease-in-out infinite;
        }
        .char-ear-r {
            transform-origin: 86px 32px;
            animation: earTwitchR 4.6s ease-in-out infinite;
        }
        .char-wing-l {
            transform-origin: 28px 62px;
            animation: wingIdleL 3.8s ease-in-out infinite;
        }
        .char-wing-r {
            transform-origin: 92px 62px;
            animation: wingIdleR 3.8s ease-in-out infinite;
        }
        .char-tail {
            transform-origin: 26px 92px;
            animation: tailSway 3.1s ease-in-out infinite;
        }
        .char-whiskers {
            transform-origin: 60px 56px;
            animation: whiskerTwitch 4.2s ease-in-out infinite;
        }
        .char-hand-prop {
            transform-origin: 94px 82px;
            animation: propFloat 3.4s ease-in-out infinite;
        }
        .char-pupil {
            transition: transform 0.16s ease-out;
        }
        .char-sweat, .char-anger-vein, .char-sparkles, .char-sleep-bubble,
        .char-moyin-pillow, .char-moyin-nightcap, .char-moyin-zzz,
        .char-streak-fx {
            opacity: 0;
            transition: opacity 0.32s ease, transform 0.38s var(--ease-spring);
            pointer-events: none;
        }

        /* Estados de Sueño y Emociones */
        [data-mood="sleeping"] .char-breathe {
            animation: sleepBreathe 4.2s ease-in-out infinite;
        }
        [data-mood="sleeping"] .char-head-group {
            animation: moyinSleepPillowRest 4.2s ease-in-out infinite;
        }
        [data-mood="sleeping"] .char-sleep-bubble {
            opacity: 1;
            animation: snotBubble 4.2s ease-in-out infinite;
        }
        [data-mood="sleeping"] .char-moyin-pillow {
            opacity: 1;
            animation: pillowPopIn 0.55s var(--ease-spring) forwards;
        }
        [data-mood="sleeping"] .char-moyin-nightcap {
            opacity: 1;
            animation: nightcapSway 4.2s ease-in-out infinite;
        }
        [data-mood="sleeping"] .char-moyin-zzz {
            opacity: 1;
        }
        [data-mood="sleeping"] .zzz-1 { animation: floatZzz 3.2s ease-in-out infinite; }
        [data-mood="sleeping"] .zzz-2 { animation: floatZzz 3.2s ease-in-out 1.05s infinite; }
        [data-mood="sleeping"] .zzz-3 { animation: floatZzz 3.2s ease-in-out 2.1s infinite; }

        /* Rachas por Profesor y Tier (1, 2, 3) */
        [data-streak-tier="1"] .char-streak-t1,
        [data-streak-tier="2"] .char-streak-t1,
        [data-streak-tier="2"] .char-streak-t2,
        [data-streak-tier="3"] .char-streak-t1,
        [data-streak-tier="3"] .char-streak-t2,
        [data-streak-tier="3"] .char-streak-t3 {
            opacity: 1;
        }

        /* Dr. Alfred */
        [data-doc="alfred"][data-streak-tier="1"]:not([data-mood="sleeping"]) .char-breathe { animation: alfredZenHover1 2.6s ease-in-out infinite; }
        [data-doc="alfred"][data-streak-tier="2"]:not([data-mood="sleeping"]) .char-breathe { animation: alfredZenHover2 2.1s ease-in-out infinite; }
        [data-doc="alfred"][data-streak-tier="2"]:not([data-mood="sleeping"]) .char-wing-l { animation: alfredZenWingL 2.1s ease-in-out infinite; }
        [data-doc="alfred"][data-streak-tier="2"]:not([data-mood="sleeping"]) .char-wing-r { animation: alfredZenWingR 2.1s ease-in-out infinite; }
        [data-doc="alfred"][data-streak-tier="3"]:not([data-mood="sleeping"]) .char-breathe { animation: alfredNirvanaFloat 1.65s ease-in-out infinite; }
        [data-doc="alfred"][data-streak-tier="3"] .alfred-mandala { transform-origin: 60px 60px; animation: spinSlow 9s linear infinite; }

        /* Dr. Panino */
        [data-doc="panino"][data-streak-tier="1"]:not([data-mood="sleeping"]) .char-breathe { animation: paninoDrillStance 1.3s ease-in-out infinite; }
        [data-doc="panino"][data-streak-tier="2"]:not([data-mood="sleeping"]) .char-breathe { animation: paninoPowerMarch 0.85s ease-in-out infinite; }
        [data-doc="panino"][data-streak-tier="3"]:not([data-mood="sleeping"]) .char-breathe { animation: paninoOverdrive 0.48s ease-in-out infinite; }
        [data-doc="panino"][data-streak-tier="3"] .panino-lightning { animation: lightningFlash 0.65s ease-in-out infinite; }

        /* Dr. Chiquistriquis */
        [data-doc="chiquistriquis"][data-streak-tier="1"]:not([data-mood="sleeping"]) .char-head-group { animation: chiquiGrooveHead 1.25s ease-in-out infinite; }
        [data-doc="chiquistriquis"][data-streak-tier="2"]:not([data-mood="sleeping"]) .char-breathe { animation: chiquiDanceBounce 0.9s ease-in-out infinite; }
        [data-doc="chiquistriquis"][data-streak-tier="3"]:not([data-mood="sleeping"]) .char-breathe { animation: chiquiPartyZoomies 0.68s ease-in-out infinite; }
        [data-doc="chiquistriquis"][data-streak-tier="3"] .chiqui-disco-rays { transform-origin: 60px 60px; animation: spinSlow 5.5s linear infinite; }

        /* Dr. Moyin */
        [data-doc="moyin"][data-streak-tier="1"]:not([data-mood="sleeping"]) .char-head-group { animation: moyinChillSway 1.9s ease-in-out infinite; }
        [data-doc="moyin"][data-streak-tier="2"]:not([data-mood="sleeping"]) .char-breathe { animation: moyinOnsenBob 1.5s ease-in-out infinite; }
        [data-doc="moyin"][data-streak-tier="3"]:not([data-mood="sleeping"]) .char-breathe { animation: moyinSupremeVibe 1.15s ease-in-out infinite; }
        [data-doc="moyin"][data-streak-tier="3"] .moyin-steam { animation: steamRise 2.2s ease-in-out infinite; }

        /* Emociones puntuales */
        [data-mood="happy"] .char-breathe { animation: happyBounce 0.55s var(--ease-spring) 2 !important; }
        [data-mood="happy"] .char-sparkles { opacity: 1; animation: sparklePulse 0.9s ease-in-out infinite; }
        [data-mood="angry"] .char-breathe { animation: angryShake 0.42s ease-in-out 3 !important; }
        [data-mood="angry"] .char-anger-vein { opacity: 1; animation: veinThrob 0.55s ease-in-out infinite; }
        [data-mood="thinking"] .char-head-group { animation: thinkingHeadTilt 2.2s ease-in-out infinite; }
        [data-mood="thinking"] .char-sweat { opacity: 1; }

        @keyframes gentleBreathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2.4px) scale(1.012, 1.022); } }
        @keyframes headIdleTilt { 0%, 100% { transform: rotate(0deg); } 35% { transform: rotate(-1.6deg); } 70% { transform: rotate(1.6deg); } }
        @keyframes naturalBlink { 0%, 44%, 48%, 92%, 96%, 100% { transform: scaleY(0); } 46%, 94% { transform: scaleY(1); } }
        @keyframes earTwitchL { 0%, 82%, 100% { transform: rotate(0deg); } 86% { transform: rotate(-9deg); } }
        @keyframes earTwitchR { 0%, 60%, 100% { transform: rotate(0deg); } 65% { transform: rotate(10deg); } }
        @keyframes wingIdleL { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
        @keyframes wingIdleR { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
        @keyframes tailSway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(12deg); } }
        @keyframes whiskerTwitch { 0%, 75%, 100% { transform: rotate(0deg); } 82% { transform: rotate(2.5deg); } }
        @keyframes propFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
        @keyframes happyBounce { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-11px); } }
        @keyframes angryShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } }
        @keyframes thinkingHeadTilt { 0%, 100% { transform: rotate(-4.5deg); } 50% { transform: rotate(-7.5deg); } }
        @keyframes sparklePulse { 0%, 100% { transform: scale(0.88); opacity: 0.7; } 50% { transform: scale(1.12); opacity: 1; } }
        @keyframes veinThrob { 0%, 100% { transform: scale(0.9); } 50% { transform: scale(1.18); } }
        @keyframes sleepBreathe { 0%, 100% { transform: translateY(3px) scale(1.02, 0.95); } 50% { transform: translateY(6px) scale(1.05, 0.92); } }
        @keyframes moyinSleepPillowRest { 0%, 100% { transform: translate(-6px, 9px) rotate(-14deg); } 50% { transform: translate(-7px, 12px) rotate(-17.5deg); } }
        @keyframes pillowPopIn { 0% { transform: scale(0.4) translateY(10px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes nightcapSway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
        @keyframes floatZzz { 0% { transform: translate(0, 0) scale(0.6); opacity: 0; } 30% { opacity: 0.95; } 100% { transform: translate(14px, -24px) scale(1.18); opacity: 0; } }
        @keyframes snotBubble { 0%, 100% { transform: scale(0.5); opacity: 0.55; } 50% { transform: scale(1.32); opacity: 0.95; } }
        @keyframes alfredZenHover1 { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(-7px); } }
        @keyframes alfredZenHover2 { 0%, 100% { transform: translateY(-4px); } 50% { transform: translateY(-11px); } }
        @keyframes alfredNirvanaFloat { 0%, 100% { transform: translateY(-5px); } 50% { transform: translateY(-14px); } }
        @keyframes paninoDrillStance { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.5px); } }
        @keyframes paninoPowerMarch { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-6px) rotate(1.5deg); } }
        @keyframes paninoOverdrive { 0%, 100% { transform: translate(-1.5px, -2px); } 50% { transform: translate(1.5px, -7px); } }
        @keyframes lightningFlash { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
        @keyframes chiquiGrooveHead { 0%, 100% { transform: translateX(-2.5px) rotate(-4deg); } 50% { transform: translateX(2.5px) rotate(4deg); } }
        @keyframes chiquiDanceBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
        @keyframes chiquiPartyZoomies { 0%, 100% { transform: translate(-3px, 0) rotate(-4deg); } 50% { transform: translate(3px, -9px) rotate(4deg); } }
        @keyframes moyinChillSway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
        @keyframes moyinOnsenBob { 0%, 100% { transform: translateY(1px); } 50% { transform: translateY(-5px); } }
        @keyframes moyinSupremeVibe { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-7px) rotate(1.5deg); } }
        @keyframes steamRise { 0%, 100% { transform: translateY(2px); opacity: 0.45; } 50% { transform: translateY(-5px); opacity: 0.95; } }
        @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Estilos Armario e Ítems con Miniaturas Realistas */
        .w-item-btn {
            background: #0A0A0A;
            border: 1px solid #1C1C1C;
            border-radius: 1rem;
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            position: relative;
        }
        .w-item-btn:hover { border-color: #E4DDCB; transform: translateY(-2px); }
        .w-item-btn.equipped { border-color: #E4DDCB; background: rgba(228, 221, 203, 0.07); }
        .w-item-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
        .w-item-thumb { width: 100%; max-width: 104px; aspect-ratio: 1/1; padding: .5rem; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rc, #94A3B8) 20%, transparent), rgba(255,255,255,.02) 72%); border-radius: .85rem; border: 1px solid rgba(255,255,255,.06); }
        .w-item-name { font-size: 0.82rem; font-weight: 500; text-align: center; }
        .w-item-req { font-size: 0.7rem; color: #94A3B8; }

        /* ===== KORE · Minimal negro + movimiento ===== */
        html, body { background: #000; }
        h1, h2, h3, .font-serif-kore { font-optical-sizing: auto; font-weight: 300; letter-spacing: -0.025em; font-feature-settings: "liga","kern"; }
        [hidden] { display: none !important; }
        body::before { content:""; position:fixed; inset:-20%; z-index:-1; pointer-events:none;
            background: radial-gradient(38% 32% at 18% 22%, rgba(255,255,255,.075), transparent 70%), radial-gradient(34% 30% at 82% 78%, rgba(255,255,255,.055), transparent 70%);
            animation: koreDrift 28s ease-in-out infinite alternate; }
        body::after { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.05;
            background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
        @keyframes koreDrift { from { transform: translate3d(-3%,-2%,0) scale(1); } to { transform: translate3d(4%,3%,0) scale(1.12); } }
        @keyframes koreRise { from { opacity:0; transform: translateY(18px); filter: blur(6px); } to { opacity:1; transform:none; filter:none; } }
        @keyframes koreWord { from { opacity:0; transform: translateY(.45em); filter: blur(8px); } to { opacity:1; transform:none; filter:none; } }
        @keyframes koreModal { from { opacity:0; transform: scale(.96) translateY(14px); } to { opacity:1; transform:none; } }
        @keyframes koreFade { from { opacity:0; } to { opacity:1; } }
        .k-rise { animation: koreRise .9s var(--ease-out-expo) calc(var(--d,0) * 1ms) backwards; }
        .kw { display:inline-block; animation: koreWord 1.1s var(--ease-out-expo) calc(var(--d,0) * 1ms + var(--w,0) * 80ms) backwards; }
        #wardrobeModal:not([hidden]) { animation: koreFade .35s ease both; }
        #wardrobeModal:not([hidden]) > div { animation: koreModal .6s var(--ease-spring) both; }
        .w-item-btn { animation: koreRise .55s var(--ease-out-expo) backwards; }
        button:not(:disabled):hover { transform: translateY(-1px); }
        button:not(:disabled):active { transform: scale(.97); }
        .doc-card:hover { transform: translateY(-6px); box-shadow: 0 20px 60px -20px rgba(255,255,255,.12); }

        /* Rachas: el brillo y el movimiento crecen con el tier (1, 2, 3) */
        .char-svg[data-streak-tier="1"], .char-svg[data-streak-tier="2"], .char-svg[data-streak-tier="3"] { animation: koreGlow 3s ease-in-out infinite; }
        .char-svg[data-streak-tier="1"] { --g1:3px; --g2:8px; }
        .char-svg[data-streak-tier="2"] { --g1:8px; --g2:16px; animation-duration: 2.1s; }
        .char-svg[data-streak-tier="3"] { --g1:12px; --g2:28px; animation-duration: 1.3s; }
        .char-svg[data-doc="alfred"] { --sg: rgba(56,189,248,.7); }
        .char-svg[data-doc="panino"] { --sg: rgba(245,158,11,.75); }
        .char-svg[data-doc="chiqui"], .char-svg[data-doc="chiquistriquis"] { --sg: rgba(232,121,249,.75); }
        .char-svg[data-doc="moyin"] { --sg: rgba(52,211,153,.65); }
        @keyframes koreGlow { 0%,100% { filter: drop-shadow(0 0 var(--g1) var(--sg)); } 50% { filter: drop-shadow(0 0 var(--g2) var(--sg)); } }
        @keyframes koreDiscoGlow { 0% { filter: drop-shadow(0 0 22px #E879F9); } 33% { filter: drop-shadow(0 0 22px #38BDF8); } 66% { filter: drop-shadow(0 0 22px #FACC15); } 100% { filter: drop-shadow(0 0 22px #E879F9); } }
        @keyframes koreFloatS { 0%,100% { translate: 0 0; } 50% { translate: 0 -4px; } }
        @keyframes koreFloatL { 0%,100% { translate: 0 0; } 50% { translate: 0 -10px; } }
        @keyframes koreJitter { 0%{translate:0 0} 25%{translate:-1.5px 1px} 50%{translate:1.5px -1px} 75%{translate:-1px -1.5px} 100%{translate:0 0} }
        @keyframes koreBounceS { 0%,100% { translate: 0 0; } 50% { translate: 0 -5px; } }
        @keyframes koreSwayS { 0%,100% { rotate: -2deg; } 50% { rotate: 2deg; } }
        /* Alfred: levita cada vez más alto */
        .char-svg[data-doc="alfred"][data-streak-tier="2"] { animation: koreGlow 2.1s ease-in-out infinite, koreFloatS 3s ease-in-out infinite; }
        .char-svg[data-doc="alfred"][data-streak-tier="3"] { animation: koreGlow 1.3s ease-in-out infinite, koreFloatL 3.4s ease-in-out infinite; }
        /* Panino: tiembla de rigor y de furia */
        .char-svg[data-doc="panino"][data-streak-tier="2"] { animation: koreGlow 2.1s ease-in-out infinite, koreJitter .5s linear infinite; }
        .char-svg[data-doc="panino"][data-streak-tier="3"] { animation: koreGlow .9s ease-in-out infinite, koreJitter .18s linear infinite; }
        /* Chiquistriquis: rebota y se vuelve disco */
        .char-svg[data-doc="chiqui"][data-streak-tier="2"], .char-svg[data-doc="chiquistriquis"][data-streak-tier="2"] { animation: koreGlow 2.1s ease-in-out infinite, koreBounceS .7s ease-in-out infinite; }
        .char-svg[data-doc="chiqui"][data-streak-tier="3"], .char-svg[data-doc="chiquistriquis"][data-streak-tier="3"] { animation: koreDiscoGlow 2.4s linear infinite, koreBounceS .45s ease-in-out infinite; }
        /* Moyin: se mece como en el onsen */
        .char-svg[data-doc="moyin"][data-streak-tier="2"] { animation: koreGlow 2.1s ease-in-out infinite, koreSwayS 3.2s ease-in-out infinite; }
        .char-svg[data-doc="moyin"][data-streak-tier="3"] { animation: koreGlow 1.3s ease-in-out infinite, koreSwayS 2.2s ease-in-out infinite, koreFloatS 2.6s ease-in-out infinite; }

        /* Moyin: bosteza, cae la almohada, se pone el gorrito y duerme */
        .char-moyin-pillow, .char-moyin-nightcap { transform-box: fill-box; transform-origin: center; }
        @keyframes pillowPopIn { 0% { opacity:0; transform: translateY(34px) scale(.7); } 60% { opacity:1; transform: translateY(-5px) scale(1.05); } 100% { opacity:1; transform:none; } }
        @keyframes nightcapDrop { 0% { opacity:0; transform: translateY(-34px) rotate(-18deg); } 65% { opacity:1; transform: translateY(3px) rotate(4deg); } 100% { opacity:1; transform:none; } }
        @keyframes headDroop { from { transform: translate(0,0) rotate(0); } to { transform: translate(-1px,9px) rotate(-8deg); } }
        @keyframes moyinSleepPillowRest { 0%,100% { transform: translate(-1px,9px) rotate(-8deg); } 50% { transform: translate(-1px,11px) rotate(-7deg); } }
        @keyframes drowsyNod { 0%,100% { transform: rotate(0); } 35% { transform: translateY(5px) rotate(-6deg); } 50% { transform: translateY(1px) rotate(-1deg); } 75% { transform: translateY(6px) rotate(-7deg); } }
        [data-mood="sleeping"] .char-moyin-pillow { animation: pillowPopIn .9s var(--ease-spring) both !important; }
        [data-mood="sleeping"] .char-moyin-nightcap { animation: nightcapDrop .9s var(--ease-spring) .35s both, nightcapSway 4.2s ease-in-out 1.25s infinite !important; }
        [data-mood="sleeping"] .char-head-group { animation: headDroop 1.1s var(--ease-out-expo) both, moyinSleepPillowRest 4.2s ease-in-out 1.1s infinite !important; }
        [data-mood="drowsy"] .char-head-group { animation: drowsyNod 2.2s ease-in-out infinite !important; }

            S(3, .5, "¿Cuál es el compromiso del artefacto Incremento?", ["El Objetivo del Producto", "El Objetivo del Sprint", "La Definición de Terminado (Definition of Done)", "La Definition of Ready", "La velocidad del equipo"], 2, "Scrum Guide: Incremento");
            S(3, .5, "Según lo visto en clase, ¿cuál afirmación sobre el Scrum Master es correcta?", ["Define y estima las historias", "Es el jefe jerárquico del equipo", "Debe ser necesariamente un técnico senior", "Es un facilitador entre el PO y los Developers; lidera sin jerarquía, no define ni estima, y es más social que técnico", "Prioriza el Product Backlog"], 3, "03.09.26 ICS Teoría: Scrum Master");
            S(3, .5, "Si en un sprint no se cumple la totalidad de las tareas, ¿qué ocurre según la cátedra?", ["El sprint se cancela automáticamente", "Se despide al Scrum Master", "Las tareas y el objetivo no cumplidos pasan al siguiente sprint; si se repite de forma sostenida, hay que ajustar el proceso", "Se oculta el resultado en la Sprint Review", "Se extiende el sprint hasta terminar todo"], 2, "03.09.26 ICS Teoría: Sprint Review");
            S(3, .5, "¿Qué se ajusta en la Sprint Review y qué en la Sprint Retrospective?", ["La Review ajusta el proceso y la Retro el producto", "Ambas ajustan solo el backlog", "La Review ajusta el proyecto con feedback de stakeholders; la Retro ajusta el proceso entre los miembros del equipo", "Ninguna ajusta nada", "Ambas ajustan la arquitectura"], 2, "03.09.26 ICS Teoría: Eventos");
            S(3, .5, "¿Para qué sirve limitar el trabajo en curso (WIP) en Kanban?", ["Para que cada persona haga más tareas a la vez", "Para eliminar el tablero", "Para detectar cuellos de botella y obligar a terminar lo existente antes de empezar algo nuevo", "Para fijar sprints de duración fija", "Para asignar roles definidos"], 2, "Kanban (Atlassian): Límites WIP");
            S(3, .5, "Respecto de su origen, Kanban y Lean:", ["Surgieron en el desarrollo de software", "Surgieron en un contexto ajeno al software: la manufactura", "Surgieron junto al Manifiesto Ágil", "Son sinónimos de Scrum", "Surgieron en el Proceso Unificado"], 1, "17.09.26 ICS Teoría: Dinámica Kanban + Lean");

            // FASE 4 · Planificación y estimación
            S(4, .5, "¿Qué significa la “N” de INVEST?", ["Necesaria", "Numerada", "Normalizada", "Negociable", "Notificada"], 3, "10.09.26 ICS Teoría: Una buena historia es INVEST");
            S(4, .5, "Ante una historia compleja por desconocimiento técnico, ¿qué se hace según la cátedra?", ["Se estima igual con 100 puntos", "Se genera un spike, una tarjeta orientada a investigación; no se estima la historia que lo provocó", "Se descarta la historia", "Se asigna al Scrum Master", "Se agrega al sprint sin análisis"], 1, "17.09.26 ICS Teoría: Spike");
            S(4, .5, "En Planning Poker, ¿qué indica la carta “?”?", ["Que la historia es trivial", "Que la historia vale 100 puntos", "Que no se sabe: no hay información suficiente para estimar", "Que el voto es secreto", "Que se debe votar de nuevo sin hablar"], 2, "10.09.26 ICS Teoría: Planning Poker");
            S(4, .5, "Respecto del proceso de estimación en equipo, ¿cuál afirmación es correcta?", ["Solo estiman los desarrolladores y se considera únicamente el esfuerzo de programar", "Participan todos los roles (devs, testers, analistas) y se estima también el esfuerzo de pruebas, no solo de desarrollo", "El Scrum Master impone la estimación", "Las historias ambiguas igual deben estimarse", "Los votos no se justifican"], 1, "17.09.26 ICS Teoría: Proceso de estimación");
            S(4, .5, "Según Kniberg, ¿quién asigna la importancia de una historia y quién la estima?", ["El Scrum Master importancia y el PO la estimación", "El Product Owner asigna la importancia y el equipo de desarrollo estima", "El equipo ambas cosas", "El cliente ambas cosas", "El PO ambas cosas"], 1, "Kniberg C2: Importancia y estimación inicial");
            S(4, .5, "¿En qué consiste la técnica del “clima de ayer” (yesterday’s weather)?", ["En asumir que el rendimiento futuro será similar al de sprints pasados, usando la velocidad", "En estimar según el pronóstico del clima", "En repetir la daily del día anterior", "En revisar los bugs del día anterior", "En medir la satisfacción del cliente"], 0, "Kniberg C4: Estimación por velocidad");
            S(4, .5, "Según el Cono de Incertidumbre de Cohn, al inicio del proyecto las estimaciones de tiempo pueden diferir de la realidad entre:", ["0% y 5%", "10% y 20%", "60% y 160%", "300% y 500%", "No difieren"], 2, "Cohn C1: El cono de incertidumbre");
            S(4, .5, "¿Qué enuncia la Ley de Parkinson?", ["Que todo trabajo se termina antes de lo previsto", "Que el trabajo se expande hasta llenar todo el tiempo asignado para su realización", "Que más personas reducen siempre el tiempo", "Que las pruebas deben hacerse al final", "Que el plan nunca cambia"], 1, "Cohn C2 / Larman C37");
            M(4, 1, "¿Cuáles son los tres niveles internos de la cebolla de planificación en los que se enfocan la mayoría de los equipos ágiles?", ["Estrategia", "Portafolio", "Producto", "Lanzamiento (release)", "Iteración", "Diario"], [3, 4, 5], "Cohn C3: La cebolla de la planificación");
            S(4, .5, "En el orden de agrupación de un backlog visto en clase, la jerarquía de mayor a menor es:", ["Historia de usuario > Feature > Epic", "Feature > Epic > Historia de usuario", "Epic > Feature > Historia de usuario", "Release > Sprint > Tarea", "Epic > Historia de usuario > Feature"], 2, "10.09.26 ICS Teoría: Epic, Feature, Historia");
            S(4, .5, "¿Qué es un release en los niveles de planificación?", ["Una epic muy grande", "Una versión nueva del producto: un conjunto de funcionalidades; no es epic, feature ni historia", "Una tarea de un sprint", "Una reunión de revisión", "Un spike de investigación"], 1, "10.09.26 ICS Teoría: Release");
            S(4, .5, "¿Qué recomienda Kniberg para las historias técnicas (tech stories)?", ["Ignorarlas siempre", "Transformarlas en valor de negocio medible o acordar un porcentaje fijo de capacidad (10-20%) para abordarlas", "Que las estime el Product Owner", "Que se hagan al final del proyecto", "Que no se registren en el backlog"], 1, "Kniberg C4: Historias técnicas");

            // FASE 5 · Diseño y calidad
            S(5, .5, "En las métricas CK de Chidamber y Kemerer, WMC mide:", ["La profundidad del árbol de herencia", "La suma de la complejidad de todos los métodos de la clase; conviene que sea baja", "La cantidad de subclases inmediatas", "La cantidad de colaboraciones con otras clases", "La cohesión entre atributos"], 1, "Pressman C24: Métricas CK");
            S(5, .5, "Un DIT (profundidad del árbol de herencia) grande implica:", ["Que la clase no hereda nada", "Que se reutilizan muchos métodos heredados, pero cuesta más predecir el comportamiento y el diseño se vuelve más complejo", "Que no hay acoplamiento", "Que la clase tiene cohesión perfecta", "Que no hace falta probar la clase"], 1, "Pressman C24: DIT");
            S(5, .5, "¿Qué mide CBO (acoplamiento entre clases)?", ["La cantidad de colaboraciones que tiene la clase; conviene que sea bajo", "La cantidad de métodos privados", "La profundidad de la jerarquía", "La cantidad de líneas de código", "La cantidad de hijos de la clase"], 0, "Pressman C24: CBO");
            S(5, .5, "Un valor alto de LCOM sugiere que:", ["La clase tiene excelente cohesión", "Los métodos están acoplados entre sí a través de los atributos y probablemente convenga dividir la clase", "La clase no tiene métodos", "La clase es una interfaz", "La jerarquía es muy profunda"], 1, "Pressman C24: LCOM");
            S(5, .5, "¿Qué mide RFC (respuesta de una clase)?", ["La cantidad de subclases", "La cantidad de métodos que pueden ejecutarse en respuesta a un mensaje recibido; a mayor valor, mayor esfuerzo de prueba", "La complejidad ciclomática", "El número de atributos", "El acoplamiento con la base de datos"], 1, "Pressman C24: RFC");
            M(5, 1, "¿Cuáles métricas CK conviene mantener bajas porque, al subir, la clase se vuelve más compleja de probar y de reutilizar?", ["WMC", "DIT", "NOC", "CBO", "RFC", "LCOM"], [0, 3, 4, 5], "Pressman C24: Truco para recordarlas");
            S(5, .5, "¿Cuáles son las cuatro capas de la pirámide de diseño orientado a objetos?", ["Datos, arquitectura, interfaz y componentes", "Subsistemas, clases y objetos, mensajes y responsabilidades", "Presentación, negocio, persistencia y red", "Requisitos, análisis, diseño e implementación", "Modelo, vista, controlador y servicios"], 1, "Pressman C22: La pirámide de diseño OO");
            S(5, .5, "Cuando se puede elegir, Pressman recomienda:", ["Favorecer la herencia sobre la composición", "Favorecer la composición sobre la herencia, porque la herencia en exceso crea jerarquías grandes y difíciles de manejar", "Usar siempre herencia múltiple", "Evitar los objetos", "Usar variables globales"], 1, "Pressman C22: Composición vs herencia");
            S(5, .5, "Según Meyer, ¿qué criterio de modularidad exige que un cambio pequeño afecte solo a uno o a muy pocos módulos?", ["Descomponibilidad", "Componibilidad", "Comprensibilidad", "Continuidad", "Protección"], 3, "Pressman C22: Criterios para un buen diseño modular");
            S(5, .5, "Dos componentes que se comunican mediante un área de datos global violan el principio de:", ["Ocultamiento de información únicamente", "Pocas interfaces", "Unidades modulares lingüísticas", "Interfaces pequeñas", "Interfaces explícitas (acoplamiento común)"], 4, "Pressman C22: Principios de diseño modular");
            M(5, 1, "¿Cuál/es son atributos distintivos de las aplicaciones web (WebApps)?", ["Intensivas en red", "Evolución continua", "Impulsadas por contenido", "Versiones espaciadas en el tiempo", "Funcionan siempre aisladas de la red", "Baja exposición a riesgos de seguridad"], [0, 1, 2], "Pressman C29: Atributos de las WebApps");
            S(5, .5, "Una WebApp para realizar un pedido en una plataforma de comercio electrónico se clasifica como:", ["Informativa", "De descarga", "Interactiva", "Orientada a transacciones", "De acceso a datos"], 3, "Pressman C29: Categorías de WebApps");
            O(5, 2, "Defina las métricas CBO y LCOM y explique cómo interpretar valores altos de cada una.", "CBO (acoplamiento entre clases) es la cantidad de colaboraciones que tiene una clase (se puede obtener contando las de su tarjeta CRC). Si crece, baja la reutilización y se complican las modificaciones y pruebas; conviene que sea bajo. LCOM (falta de cohesión en los métodos) se relaciona con los métodos que comparten atributos; un valor alto indica métodos acoplados entre sí a través de atributos, y probablemente convenga dividir la clase en dos o más.", ["Define CBO como colaboraciones con otras clases", "Interpreta CBO alto: menos reutilización y más costo de cambio y prueba", "Define LCOM en términos de cohesión y atributos compartidos", "Interpreta LCOM alto: conviene dividir la clase"], "Pressman C24: Métricas CK");

            // FASE 6 · Integración y entrega
            S(6, .5, "¿Por qué existe la gestión de configuración del software?", ["Porque el software no cambia", "Porque el sistema cambiará (primera ley de la Ingeniería de Sistemas) y hay que gestionar el cambio", "Porque reemplaza al mantenimiento", "Porque es una etapa del ciclo de vida", "Porque reduce el número de desarrolladores"], 1, "08.10.26 ICS Teoría: Gestión de configuración");
            S(6, .5, "¿Qué es una línea base (baseline)?", ["Una versión o conjunto de versiones de ítems de configuración revisada y aprobada formalmente, sobre la que continúa una línea de desarrollo", "La primera rama creada en un repositorio", "Un tipo de prueba automática", "Una lista de tareas del sprint", "El backlog del producto"], 0, "08.10.26 ICS Teoría: Línea base");
            S(6, .5, "¿Qué diferencia hay entre una etiqueta (tag) y una rama (branch)?", ["Son exactamente lo mismo", "A la etiqueta no se le puede mergear nada: es inmutable", "La etiqueta admite commits nuevos y la rama no", "La rama es inmutable", "La etiqueta solo existe en SVN"], 1, "08.10.26 ICS Teoría: Etiqueta vs branch");
            M(6, 1, "¿Cuál/es son objetivos de la gestión de configuración?", ["Controlar el cambio", "Evitar inconsistencias", "Garantizar reproducibilidad", "Mantener trazabilidad", "Facilitar auditorías y liberaciones (releases) controladas", "Eliminar la necesidad de pruebas de regresión", "Reemplazar al proceso de mantenimiento"], [0, 1, 2, 3, 4], "08.10.26 ICS Teoría: Objetivos");
            S(6, .5, "¿Cuál es la diferencia entre gestión de configuración y mantenimiento?", ["Ninguna", "El mantenimiento es una etapa del ciclo de vida posterior a la entrega; la gestión de configuración no es una etapa y complementa tanto al desarrollo como al mantenimiento", "La gestión de configuración ocurre solo después de la entrega", "El mantenimiento nunca usa control de versiones", "La gestión de configuración es una etapa del ciclo de vida"], 1, "08.10.26 ICS Teoría");
            S(6, .5, "¿Qué es el entorno de staging?", ["El entorno de los desarrolladores", "El entorno de pre-producción, lo más parecido posible a producción, destinado a usuarios finales, stakeholders y testers", "El entorno de producción", "Un repositorio de código", "Una herramienta de CI"], 1, "08.10.26 ICS Teoría: Ambientes");
            S(6, .5, "En un pull request, ¿cuántas aprobaciones se requieren como mínimo según la cátedra?", ["Ninguna", "Todas las de los miembros del equipo", "Al menos 2 aprobaciones", "Exactamente 10", "Solo la del Scrum Master"], 2, "03.09.26 y 08.10.26 ICS Teoría");
            S(6, .5, "¿Qué dispara el proceso de integración continua (CI)?", ["Un commit o push a la rama principal, que compila, prueba y valida el código automáticamente", "El final del sprint", "Una aprobación del Product Owner", "La reunión diaria", "El cierre del proyecto"], 0, "DevOps: Integración continua");
            S(6, .5, "¿Qué es el desfase de configuración (configuration drift)?", ["Que la configuración de un recurso se aleje con el tiempo del estado deseado definido para él", "Un error de compilación", "Un conflicto de merge", "Una rama sin cambios", "La falta de pruebas unitarias"], 0, "DevOps: Administración de la configuración");
            S(6, .5, "¿Cuál es la distinción habitual entre entrega continua y despliegue continuo?", ["Son idénticas en todo sentido", "En la entrega continua el paso final a producción lo decide una persona (aprobación manual); en el despliegue continuo todo el camino hasta producción es automático si pasan las pruebas", "La entrega continua despliega sin pruebas", "El despliegue continuo exige aprobación manual siempre", "La entrega continua solo compila"], 1, "DevOps: Entrega continua frente a despliegue continuo");
            S(6, .5, "¿Cómo funciona el despliegue azul/verde?", ["Se mantiene la versión actual (azul) activa mientras se despliega la nueva (verde) y se le envía tráfico gradualmente; ante un incidente el tráfico vuelve a la azul", "Se despliega solo a empleados internos", "Se reemplaza producción sin respaldo", "Se activan funciones por grupo de usuarios", "Se prueba únicamente en local"], 0, "DevOps: Técnicas de exposición progresiva");
            S(6, .5, "¿Para qué sirven las feature flags (banderas de características)?", ["Para versionar el código", "Para activar o desactivar funciones para distintos grupos de usuarios sin hacer un despliegue nuevo", "Para medir la cobertura", "Para resolver conflictos de merge", "Para eliminar ramas"], 1, "DevOps: Técnicas de exposición progresiva");
            S(6, .5, "¿Qué es la infraestructura como código (IaC)?", ["Programar sin servidores", "Definir y versionar los recursos del sistema de forma descriptiva, como si fuera código, para implementarlos de forma repetible y controlada", "Un tipo de prueba funcional", "Un lenguaje de modelado", "Una metodología ágil"], 1, "DevOps: Prácticas de DevOps");

            // FASE 7 · Mantenimiento
            S(7, .5, "Se modifica un sistema para que siga siendo usable tras un cambio de sistema operativo. ¿Qué tipo de mantenimiento es?", ["Correctivo", "Adaptativo", "Perfectivo", "Preventivo", "Ninguno"], 1, "SWEBOK v3.0 C5: Categorías de mantenimiento");
            S(7, .5, "Se agrega un filtro de búsqueda solicitado por los usuarios y se mejora la documentación. ¿Qué tipo de mantenimiento es?", ["Perfectivo", "Correctivo", "Adaptativo", "Preventivo", "Reingeniería"], 0, "SWEBOK v3.0 C5");
            S(7, .5, "Se detecta y corrige una falla latente antes de que se convierta en una falla efectiva. ¿Qué tipo de mantenimiento es?", ["Correctivo", "Adaptativo", "Perfectivo", "Preventivo", "Evolutivo"], 3, "SWEBOK v3.0 C5 (IEEE 14764 agrega la categoría preventiva)");
            S(7, .5, "Un arreglo reactivo, posterior a la entrega, para corregir problemas descubiertos es mantenimiento:", ["Perfectivo", "Adaptativo", "Preventivo", "Correctivo", "Proactivo"], 3, "SWEBOK v3.0 C5");
            M(7, 1, "¿Cuáles de estas categorías de mantenimiento son proactivas?", ["Correctivo", "Preventivo", "Adaptativo", "Perfectivo"], [1, 3], "SWEBOK v3.0 C5: corrección (correctivo reactivo, preventivo proactivo) y mejora (adaptativo reactivo, perfectivo proactivo)");
            S(7, .5, "Según SWEBOK, cerca de la mitad del esfuerzo de mantenimiento se va en:", ["Escribir código nuevo", "Capacitar usuarios", "Entender el software que hay que modificar (comprensión limitada)", "Comprar licencias", "Redactar contratos"], 2, "SWEBOK v3.0 C5: Problemas técnicos");
            S(7, .5, "¿Qué es una prueba de regresión?", ["Una prueba que verifica que un cambio reciente (bug, funcionalidad, actualización) no haya roto funcionalidades que antes andaban bien", "Una prueba de carga final", "Una prueba de aceptación del cliente únicamente", "Una prueba del entorno de staging", "Una prueba de usabilidad"], 0, "08.10.26 ICS Teoría / SWEBOK C5");
            S(7, .5, "¿Qué diferencia hay entre reingeniería e ingeniería inversa?", ["Ninguna", "La reingeniería examina y altera el software para reconstruirlo en una forma nueva; la ingeniería inversa lo analiza para identificar sus componentes y relaciones", "La ingeniería inversa siempre modifica el código", "La reingeniería solo documenta", "Ambas son pruebas"], 1, "SWEBOK v3.0 C5: Técnicas de mantenimiento");
            S(7, .5, "¿Para qué sirve el análisis de impacto en el mantenimiento?", ["Para identificar las áreas afectadas por un cambio y estimar los recursos necesarios", "Para medir la velocidad del equipo", "Para eliminar pruebas", "Para planificar un sprint", "Para asignar roles"], 0, "SWEBOK v3.0 C5: Análisis de impacto");
            S(7, .5, "Según Kendall, el mantenimiento representa aproximadamente qué porcentaje del costo total del ciclo de vida del software?", ["Entre el 1% y el 5%", "Entre el 10% y el 15%", "Entre el 48% y el 60%", "Más del 95%", "0%, porque es gratuito"], 2, "Kendall C1: Prueba y mantenimiento del sistema");
            O(7, 2, "Enuncie los cuatro tipos de mantenimiento de software y describa brevemente cada uno.", "Correctivo: arreglo reactivo, posterior a la entrega, para corregir problemas descubiertos. Adaptativo: modificar el producto para que siga siendo usable en un entorno cambiado (SO, hardware, normas). Perfectivo: dar mejoras a los usuarios, mejorar la documentación o reescribir para mejorar la mantenibilidad. Preventivo: detectar y corregir fallas latentes antes de que se conviertan en fallas efectivas. Memotecnia: corregir lo que falló, acomodarse al entorno, mejorar lo que ya anda, arreglar antes de que falle.", ["Nombra los cuatro tipos", "Correctivo: reactivo, corrige fallas", "Adaptativo: cambios de entorno", "Perfectivo: mejoras", "Preventivo: fallas latentes"], "SWEBOK v3.0 C5");
        })();


        function renderApp() {
            const container = $("#appContainer");
            if (!userName || !nameConfirmed) {
                container.innerHTML = renderOnboardingWelcome();
                bindOnboardingWelcomeEvents();
            } else if (!localStorage.getItem("kore_doc_selected")) {
                container.innerHTML = renderDoctorSelectionModal();
                bindDoctorSelectionEvents();
            } else {
                container.innerHTML = renderMainDashboard();
                bindMainDashboardEvents();
            }
        }


        function koreWelcomeOverlay(name) {
            const ov = document.createElement("div");
            ov.id = "welcomeOverlay";
            const letters = (t, off) => [...t].map((ch, i) => `<span class="wl-ch" style="--i:${i + off}">${ch === " " ? "&nbsp;" : ch}</span>`).join("");
            ov.innerHTML = `<div class="wl-inner"><div class="wl-kicker">KORE · The Intellectual Sanctuary</div><h1 class="wl-title">${letters("Bienvenido,", 0)}<br><em>${letters(name, 11)}</em></h1><div class="wl-line"></div></div>`;
            document.body.appendChild(ov);
            setTimeout(() => renderApp(), 1500);
            setTimeout(() => ov.classList.add("wl-out"), 2300);
            setTimeout(() => ov.remove(), 3100);
        }

        function renderOnboardingWelcome() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 text-center max-w-2xl w-full mx-auto animate-fade-in">
                    <div class="mb-6 inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-sky-500/30 bg-sky-500/10 text-sky-400 text-xs tracking-wider uppercase">
                        <span>✦ KORE · The Intellectual Sanctuary</span>
                    </div>
                    <h1 class="font-serif-kore text-5xl md:text-7xl font-light tracking-tight mb-4 text-white">
                        Estructura tu mente. <br/><span class="italic text-sky-400">Domina tus bases.</span>
                    </h1>
                    <p class="text-slate-400 text-base md:text-lg mb-8 font-light leading-relaxed">
                        ${userName ? `Qué bueno verte de nuevo. Confirmá o cambiá tu nombre para personalizar tu sesión de hoy:` : `Bienvenido al santuario intelectual. Para comenzar, dinos tu nombre para personalizar tu experiencia académica:`}
                    </p>
                    <div class="w-full bg-[#0A0A0A] border border-[#1C1C1C] p-6 sm:p-10 rounded-2xl shadow-2xl flex flex-col gap-4">
                        <label class="text-xs uppercase tracking-wider text-left text-slate-400 font-medium">¿Cómo debemos llamarte?</label>
                        <input type="text" id="userNameInput" value="${userName}" autocomplete="off" placeholder="Ej. Gabriel, Ingeniero..." class="w-full bg-[#000000] border border-[#1C1C1C] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 text-base" />
                        <button id="startOnboardingBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-sky-500/20">
                            Ingresar al Santuario ✦
                        </button>
                    </div>
                </div>
            `;
        }

        function bindOnboardingWelcomeEvents() {
            $("#startOnboardingBtn").addEventListener("click", () => {
                const val = $("#userNameInput").value.trim();
                if (!val) return;
                userName = val;
                localStorage.setItem("kore_username", userName);
                nameConfirmed = true;
                koreWelcomeOverlay(userName);
            });
            const inp = $("#userNameInput"); if (inp) { inp.focus(); inp.select(); }
            $("#userNameInput").addEventListener("keypress", e => {
                if (e.key === "Enter") $("#startOnboardingBtn").click();
            });
        }

        function renderDoctorSelectionModal() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 max-w-6xl w-full mx-auto text-center animate-fade-in">
                    <h2 class="font-serif-kore text-3xl sm:text-5xl font-light mb-3 text-white">Elige a tu Mentor de Cátedra</h2>
                    <p class="text-slate-400 text-sm sm:text-base mb-8">Cada doctor guiará tus evaluaciones con una personalidad única. Podrás cambiar de mentor cuando desees.</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 w-full mb-8">
                        ${Object.values(DOCTORS).map(doc => `
                            <div class="doc-card border border-[#1C1C1C] bg-[#0A0A0A] p-5 sm:p-8 rounded-2xl cursor-pointer hover:border-sky-500 transition-all text-left flex flex-col sm:flex-row items-center sm:items-start gap-5 ${activeDocId === doc.id ? 'ring-2 ring-sky-500 bg-sky-500/5' : ''}" data-docid="${doc.id}">

        function bindDoctorSelectionEvents() {
            $$(".doc-card").forEach(card => {
                card.addEventListener("click", () => {
                    $$(".doc-card").forEach(c => c.classList.remove("ring-2", "ring-sky-500", "bg-sky-500/5"));
                    card.classList.add("ring-2", "ring-sky-500", "bg-sky-500/5");
                    activeDocId = card.dataset.docid;
                    localStorage.setItem("kore_doc", activeDocId);
                });
            });
            $("#confirmDocBtn").addEventListener("click", () => {
                localStorage.setItem("kore_doc_selected", "true");
                renderApp();
            });
        }

        /* ===== Tracking: estadísticas persistentes ===== */
        const STATS_KEY = "kore_stats";
        function defaultStats() { return { answered: 0, correct: 0, partial: 0, wrong: 0, sessions: 0, bestStreak: 0, byPhase: {}, daily: {}, history: [] }; }
        function loadStats() { try { return Object.assign(defaultStats(), JSON.parse(localStorage.getItem(STATS_KEY) || "{}")); } catch (e) { return defaultStats(); } }
        let stats = loadStats();
        function saveStats() { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); }
        function dayKey(d = new Date()) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
        function recordQuestion(q, status, xpGain) {
            stats.answered++;
            stats[status === "ok" ? "correct" : status === "part" ? "partial" : "wrong"]++;
            const ph = stats.byPhase[q.phase] || (stats.byPhase[q.phase] = { ok: 0, part: 0, bad: 0 });
            ph[status === "ok" ? "ok" : status === "part" ? "part" : "bad"]++;
            const d = stats.daily[dayKey()] || (stats.daily[dayKey()] = { q: 0, ok: 0, xp: 0 });
            d.q++; if (status === "ok") d.ok++; d.xp += xpGain;
            stats.bestStreak = Math.max(stats.bestStreak, streak);
            saveStats();
        }
        function recordSession(nota, ok, pts, max, n, xpGain) {
            stats.sessions++;
            stats.history.unshift({ t: Date.now(), nota, ok, pts, max, n, mode: studyMode, xp: xpGain });
            stats.history = stats.history.slice(0, 80);
            saveStats();
        }
        let dailyGoal = parseInt(localStorage.getItem("kore_goal") || "10");
        const accOf = o => { const t = o.ok + o.part + o.bad; return t ? Math.round((o.ok + o.part * 0.5) / t * 100) : null; };
        function globalAccuracy() { return stats.answered ? Math.round((stats.correct + stats.partial * 0.5) / stats.answered * 100) : 0; }
        function studyDayStreak() {
            let n = 0; const d = new Date();
            if (!(stats.daily[dayKey(d)] && stats.daily[dayKey(d)].q)) d.setDate(d.getDate() - 1);
            while (stats.daily[dayKey(d)] && stats.daily[dayKey(d)].q) { n++; d.setDate(d.getDate() - 1); }
            return n;
        }

        /* ===== Navegación ===== */
        let currentView = "home";
        let levelsDocView = null;
        const NAV_ITEMS = [
            { id: "home", label: "Inicio", icon: "⌂" },
            { id: "levels", label: "Niveles", icon: "❖" },
            { id: "progress", label: "Progreso", icon: "◔" },
            { id: "history", label: "Historial", icon: "☷" },
            { id: "achievements", label: "Logros", icon: "✧" }
        ];
        const card = "border border-[#1C1C1C] bg-[#0A0A0A] rounded-2xl";
        const shell = "w-full max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-10";

        function renderNav(doc, rank) {
            const evo = getEvoStage(userXp);
            return `
                <header class="sticky top-0 z-40 border-b border-[#1C1C1C] bg-[#0A0A0A]/85 backdrop-blur">

                        </button>
                        <nav class="hidden md:flex items-center gap-1 flex-1">
                            ${NAV_ITEMS.map(n => `<button data-nav="${n.id}" class="nav-link ${currentView === n.id ? 'active' : ''}"><span class="opacity-70">${n.icon}</span> ${n.label}</button>`).join("")}

                        <div class="flex items-center gap-2 ml-auto">
                            <button data-nav="levels" class="flex items-center gap-2 bg-[#000000] border border-[#1C1C1C] px-3 py-1.5 rounded-full text-xs">

                            <button data-act="wardrobe" class="hidden md:flex bg-[#1C1C1C] hover:bg-slate-800 text-white text-xs px-3.5 py-2 rounded-xl border border-slate-700/50 items-center gap-2">👔 Armario</button>

                    ${NAV_ITEMS.map(n => `<button data-nav="${n.id}" class="tab-link ${currentView === n.id ? 'active' : ''}"><span class="text-lg leading-none">${n.icon}</span><span>${n.label}</span></button>`).join("")}
                    <button data-act="wardrobe" class="tab-link"><span class="text-lg leading-none">👔</span><span>Armario</span></button>
                </nav>`;
        }

        const tile = (label, value, sub) => `<div class="${card} p-4 sm:p-5"><div class="text-[10px] uppercase tracking-wider text-slate-500 mb-1.5">${label}</div><div class="font-serif-kore text-2xl sm:text-3xl text-white leading-none">${value}</div><div class="text-[11px] text-slate-500 mt-2">${sub || "&nbsp;"}</div></div>`;
        const bar = (pct, color = "bg-sky-500") => `<div class="w-full h-1.5 rounded-full bg-[#1C1C1C] overflow-hidden"><div class="${color} h-full rounded-full" style="width:${Math.max(0, Math.min(100, pct))}%"></div></div>`;

        function viewHome(doc, rank) {
            const today = stats.daily[dayKey()] || { q: 0, ok: 0, xp: 0 };
            const evo = getEvoStage(userXp);
            const nextXp = EVO_STAGES_XP[evo + 1];
            const phases = [1, 2, 3, 4, 5, 6, 7];
            const selected = studyMode === "sequential" ? phases : selectedPhasesCustom;
            let nQ = QUESTIONS_DB.filter(q => selected.includes(q.phase)).length;
            if (!nQ) nQ = QUESTIONS_DB.length;
            const goalPct = Math.round(Math.min(1, today.q / Math.max(1, dailyGoal)) * 100);
            const modeBtn = (id, key, title, desc, icon) => `
                <button type="button" id="${id}" class="p-5 sm:p-6 rounded-2xl border text-left transition-all ${studyMode === key ? 'border-sky-500 bg-sky-500/10 text-white' : 'border-[#1C1C1C] bg-[#000000] text-slate-400 hover:border-slate-700'}">
                    <div class="text-2xl mb-3 opacity-80">${icon}</div>
                    <div class="font-medium text-base mb-1">${title}</div>
                    <div class="text-xs opacity-75 leading-relaxed">${desc}</div>
                </button>`;
            const phaseCard = f => {
                const ph = stats.byPhase[f]; const a = ph ? accOf(ph) : null;
                const cnt = QUESTIONS_DB.filter(q => q.phase === f).length;
                const inner = `
                    <div class="flex items-center justify-between mb-2"><span class="text-[10px] uppercase tracking-wider text-sky-400">Fase ${f}</span>${studyMode === 'custom' ? `<input type="checkbox" value="${f}" class="custom-phase-chk accent-sky-500 w-4 h-4" ${selectedPhasesCustom.includes(f) ? 'checked' : ''}/>` : `<span class="text-[10px] text-slate-500">${cnt} preg.</span>`}</div>
                    <div class="text-sm text-slate-200 font-medium leading-snug mb-3 min-h-[2.5rem]">${PHASE_NAMES[f]}</div>
                    ${bar(a || 0, a === null ? 'bg-slate-700' : a >= 70 ? 'bg-emerald-400' : a >= 40 ? 'bg-amber-400' : 'bg-rose-400')}
                    <div class="text-[10px] text-slate-500 mt-1.5">${a === null ? 'Sin intentos' : 'Dominio ' + a + '%'}${studyMode === 'custom' ? ' · ' + cnt + ' preg.' : ''}</div>`;
                const on = studyMode === 'custom' && selectedPhasesCustom.includes(f);
                return studyMode === 'custom'
                    ? `<label class="p-4 rounded-xl border cursor-pointer ${on ? 'border-sky-500/60 bg-sky-500/5' : 'border-[#1C1C1C] bg-[#000000]'} hover:border-slate-600">${inner}</label>`
                    : `<div class="p-4 rounded-xl border border-[#1C1C1C] bg-[#000000]">${inner}</div>`;
            };
            return `
                <main class="${shell} flex-1 py-6 lg:py-8 pb-28 md:pb-10 flex flex-col gap-6 animate-fade-in">
                    <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2">
                        <div>
                            <p class="text-xs uppercase tracking-[0.25em] text-slate-500 mb-2">Santuario · ${rank.title}</p>
                            <h1 class="font-serif-kore text-3xl sm:text-4xl lg:text-5xl font-light text-white">Hola, <span class="italic text-sky-400">${userName || 'estudiante'}</span></h1>
                        </div>
                        <p class="text-sm text-slate-400">${today.q ? `Hoy respondiste ${today.q} ${today.q === 1 ? 'pregunta' : 'preguntas'} · +${today.xp} XP` : 'Hoy todavía no empezaste. ¡Un buen día para estudiar!'}</p>
                    </div>

                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                        ${tile("Experiencia", userXp + ' <span class="text-sm text-slate-500">XP</span>', "Nivel " + rank.lvl + " · " + rank.title)}
                        ${tile("Racha actual", streak + ' <span class="text-sm">🔥</span>', "Mejor racha: " + Math.max(stats.bestStreak, streak))}
                        ${tile("Precisión global", globalAccuracy() + '%', stats.answered + " respondidas")}
                        ${tile("Meta de hoy", today.q + '/' + dailyGoal, bar(goalPct, 'bg-emerald-400'))}
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
                        <section class="lg:col-span-4 xl:col-span-3 ${card} p-6 relative overflow-hidden flex flex-col items-center text-center">
                            <div class="absolute top-3 right-3 text-[10px] bg-sky-500/10 text-sky-400 px-2.5 py-1 rounded-full border border-sky-500/20">Racha x${streak} 🔥</div>
                            <div id="avatarStage" class="avatar-fit w-44 h-44 sm:w-52 sm:h-52 lg:w-60 lg:h-60 my-4 flex items-center justify-center bg-[#000000] rounded-full border border-[#1C1C1C] shadow-inner" data-doc="${activeDocId}" data-streak-tier="${streak >= 6 ? 3 : streak >= 4 ? 2 : streak >= 2 ? 1 : 0}">
                                <div id="dockAvatarMount" class="w-full h-full">${renderCharacterSVG(activeDocId, equipped, false, "idle", streak)}</div>
                            </div>
                            <h3 class="font-serif-kore text-xl font-medium text-white">${doc.name}</h3>
                            <p class="text-xs text-sky-400 font-medium mb-1">${doc.species}</p>
                            <button data-nav="levels" class="text-[11px] text-slate-400 hover:text-white mb-4">Etapa ${evo + 1}: <b class="text-slate-200">${evoName(activeDocId, evo)}</b> →</button>
                            <div class="w-full mb-4">${bar(nextXp ? (userXp - EVO_STAGES_XP[evo]) / (nextXp - EVO_STAGES_XP[evo]) * 100 : 100)}<div class="text-[10px] text-slate-500 mt-1.5">${nextXp ? (nextXp - userXp) + ' XP para evolucionar' : 'Evolución máxima alcanzada'}</div></div>
                            <div id="docSpeechBubble" class="bg-[#000000] border border-[#1C1C1C] p-3.5 rounded-xl text-xs text-slate-300 italic w-full mb-4">"${doc.greeting(userName)}"</div>
                            <button id="startExamBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-sky-500/20 text-sm mt-auto">Iniciar Sesión de Elenchus ✦</button>
                        </section>

                        <section class="lg:col-span-8 xl:col-span-9 ${card} p-5 sm:p-8 flex flex-col">
                            <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3 mb-6">
                                <div>
                                    <h2 class="font-serif-kore text-2xl sm:text-3xl font-light text-white mb-1">¿Cómo querés evaluarte hoy?</h2>
                                    <p class="text-sm text-slate-400">Elegí cómo estructurar tu recorrido de autoevaluación académica.</p>
                                </div>
                                <div class="text-xs bg-[#000000] border border-[#1C1C1C] rounded-full px-4 py-2 text-slate-300 shrink-0">${nQ} preguntas en esta sesión</div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                                ${modeBtn("modeSeqBtn", "sequential", "Secuencial por Fases", "Avanzá ordenadamente de la Fase 1 a la 7, como en el recorrido de la cátedra.", "≡")}
                                ${modeBtn("modeCustomBtn", "custom", "Estudio Personalizado", "Elegí puntualmente qué fases querés evaluar y reforzá tus puntos débiles.", "◈")}
                            </div>
                            <div class="flex items-center justify-between mb-3">
                                <label class="text-xs uppercase tracking-wider text-slate-400 font-medium">${studyMode === 'custom' ? 'Seleccioná las fases activas' : 'Mapa de fases y tu dominio'}</label>
                                ${studyMode === 'custom' ? `<span class="text-[11px] text-slate-500">${selectedPhasesCustom.length} de 7 activas</span>` : ''}
                            </div>
                            <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4">
                                ${phases.map(phaseCard).join("")}
                                <button id="startExamBtn2" class="rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold p-4 text-sm flex flex-col items-center justify-center gap-1 col-span-2 md:col-span-1 min-h-[7rem]"><span class="text-2xl">✦</span>Comenzar<span class="text-[11px] font-normal opacity-70">${nQ} preguntas</span></button>
                            </div>
                        </section>
                    </div>
                </main>`;
        }

        function viewLevels(rank) {
            const next = RANKS.find(r => r.minXp > userXp);
            const pct = next ? (userXp - rank.minXp) / (next.minXp - rank.minXp) * 100 : 100;
            const docId = levelsDocView || activeDocId;
            const evo = getEvoStage(userXp);
            const E = EVOLUTION[evoDocKey(docId)];
            return `
                <main class="${shell} flex-1 py-6 lg:py-8 pb-28 md:pb-10 flex flex-col gap-6 animate-fade-in">
                    <section class="${card} p-6 sm:p-8 grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                        <div class="md:col-span-8">
                            <p class="text-xs uppercase tracking-[0.25em] text-slate-500 mb-2">Nivel actual</p>
                            <h1 class="font-serif-kore text-4xl sm:text-5xl font-light text-white mb-1">Nivel <span class="text-sky-400">${rank.lvl}</span></h1>
                            <p class="text-slate-300 mb-5">${rank.title}</p>
                            ${bar(pct)}
                            <div class="flex justify-between text-xs text-slate-500 mt-2"><span>${userXp} XP</span><span>${next ? 'Próximo: ' + next.title + ' (' + next.minXp + ' XP)' : 'Rango máximo alcanzado'}</span></div>
                        </div>
                        <div class="md:col-span-4 grid grid-cols-2 gap-3">
                            ${tile("Prendas", WARDROBE_ITEMS.filter(i => i.reqLvl <= rank.lvl).length + '/120', "desbloqueadas")}
                            ${tile("Evolución", (evo + 1) + '/5', evoName(activeDocId, evo))}
                        </div>
                    </section>

                    <section class="${card} p-5 sm:p-8">
                        <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4 mb-6">
                            <div>
                                <h2 class="font-serif-kore text-2xl sm:text-3xl font-light text-white mb-1">Evolución de mentores</h2>
                                <p class="text-sm text-slate-400">Cada mentor evoluciona a su manera con tu XP acumulada, sin importar las prendas que lleve puestas.</p>
                            </div>
                            <div class="flex gap-2 overflow-x-auto pb-1">
                                ${Object.values(DOCTORS).map(d => `<button data-levdoc="${d.id}" class="shrink-0 px-3.5 py-2 rounded-xl text-xs border ${docId === d.id ? 'bg-sky-500 text-slate-950 border-sky-500 font-medium' : 'bg-[#000000] border-[#1C1C1C] text-slate-400 hover:text-white'}">${d.name}</button>`).join("")}
                            </div>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-3 sm:gap-4">
                            ${E.names.map((nm, i) => {
                                const unlocked = userXp >= EVO_STAGES_XP[i], current = i === evo;
                                return `<div class="rounded-2xl border p-4 flex flex-col items-center text-center ${current ? 'border-sky-500 bg-sky-500/5' : 'border-[#1C1C1C] bg-[#000000]'}">
                                    <div class="avatar-fit w-28 h-28 sm:w-32 sm:h-32 rounded-full bg-[#0A0A0A] border border-[#1C1C1C] flex items-center justify-center mb-3 ${unlocked ? '' : 'evo-locked'}">${renderCharacterSVG(docId, {}, false, "idle", 0, i)}</div>
                                    <div class="text-[10px] uppercase tracking-wider ${current ? 'text-sky-400' : 'text-slate-500'} mb-1">Etapa ${i + 1}${current ? ' · Actual' : ''}</div>
                                    <div class="font-serif-kore text-base text-white mb-1">${unlocked ? nm : '???'}</div>
                                    <p class="text-[11px] text-slate-400 leading-relaxed mb-2">${unlocked ? E.desc[i] : 'Seguí sumando XP para descubrir esta forma.'}</p>
                                    <div class="text-[10px] text-slate-500 mt-auto">${unlocked ? '✓ Desbloqueada' : '🔒 ' + EVO_STAGES_XP[i] + ' XP'}</div>
                                </div>`;
                            }).join("")}
                        </div>
                    </section>

                    <section class="${card} p-5 sm:p-8">
                        <h2 class="font-serif-kore text-2xl sm:text-3xl font-light text-white mb-5">Escalera de rangos</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${RANKS.map(r => {
                                const reached = userXp >= r.minXp, cur = r.lvl === rank.lvl;
                                const un = WARDROBE_ITEMS.filter(i => i.reqLvl <= r.lvl).length;
                                return `<div class="flex items-center gap-4 p-4 rounded-xl border ${cur ? 'border-sky-500 bg-sky-500/5' : 'border-[#1C1C1C] bg-[#000000]'} ${reached ? '' : 'opacity-50'}">
                                    <div class="w-12 h-12 shrink-0 rounded-full border ${reached ? 'border-sky-500/50 text-sky-400' : 'border-[#2a2a2a] text-slate-600'} flex items-center justify-center font-serif-kore text-lg">${r.lvl}</div>
                                    <div class="flex-1 min-w-0"><div class="text-sm text-white font-medium truncate">${r.title}</div><div class="text-[11px] text-slate-500">${r.minXp} XP · ${un} prendas</div></div>
                                    <span class="text-xs ${reached ? 'text-emerald-300' : 'text-slate-600'}">${cur ? 'Actual' : reached ? '✓' : '🔒'}</span>
                                </div>`;
                            }).join("")}
                        </div>
                    </section>
                </main>`;
        }

        function viewProgress() {
            const days = Array.from({ length: 14 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (13 - i)); return { d, k: dayKey(d), v: stats.daily[dayKey(d)] || { q: 0, ok: 0, xp: 0 } }; });
            const maxQ = Math.max(1, ...days.map(x => x.v.q));
            const today = stats.daily[dayKey()] || { q: 0, ok: 0, xp: 0 };
            const goalPct = Math.min(100, Math.round(today.q / Math.max(1, dailyGoal) * 100));
            const ring = 2 * Math.PI * 52;
            const phases = [1, 2, 3, 4, 5, 6, 7].map(f => { const ph = stats.byPhase[f] || { ok: 0, part: 0, bad: 0 }; return { f, ph, tot: ph.ok + ph.part + ph.bad, a: accOf(ph) }; });
            const weak = phases.filter(p => p.tot >= 1).sort((x, y) => x.a - y.a).slice(0, 3);
            const week = days.slice(7).reduce((t, x) => t + x.v.q, 0);
            return `
                <main class="${shell} flex-1 py-6 lg:py-8 pb-28 md:pb-10 flex flex-col gap-6 animate-fade-in">
                    <div><p class="text-xs uppercase tracking-[0.25em] text-slate-500 mb-2">Tracking</p><h1 class="font-serif-kore text-3xl sm:text-4xl lg:text-5xl font-light text-white">Tu progreso</h1></div>
                    <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 sm:gap-4">
                        ${tile("Respondidas", stats.answered, week + " esta semana")}
                        ${tile("Precisión", globalAccuracy() + '%', stats.correct + " ✓ · " + stats.partial + " ◐ · " + stats.wrong + " ✕")}

                                <div id="wardrobePreviewStage" class="avatar-fit w-40 h-40 md:w-48 md:h-48 flex items-center justify-center bg-slate-900 rounded-full border border-slate-800 mb-4 shadow-inner">
                                    ${renderCharacterSVG(activeDocId, equipped, false, "idle")}

                                    ${[["head","Sombreros"],["eyes","Lentes"],["neck","Cuello"],["body","Trajes"],["hand","Mano"],["aura","Auras"]].map(([k, l]) => `<button class="shrink-0 px-3.5 py-2 rounded-lg text-xs font-medium ${currentWardrobeCat === k ? 'bg-sky-500 text-slate-950' : 'bg-[#000000] border border-[#1C1C1C] text-slate-400 hover:text-white'}" data-wcat="${k}">${l}</button>`).join("")}
