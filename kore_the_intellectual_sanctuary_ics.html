        function bindMainDashboardEvents() {
            const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };
            $$("[data-nav]").forEach(b => b.addEventListener("click", () => { currentView = b.dataset.nav; renderApp(); window.scrollTo(0, 0); }));
            $$("[data-act='wardrobe']").forEach(b => b.addEventListener("click", openWardrobeWithCleanPreview));
            $$("[data-act='mentor']").forEach(b => b.addEventListener("click", () => { localStorage.removeItem("kore_doc_selected"); renderApp(); }));
            $$("[data-levdoc]").forEach(b => b.addEventListener("click", () => { levelsDocView = b.dataset.levdoc; renderApp(); }));
            $$("[data-goal]").forEach(b => b.addEventListener("click", () => { dailyGoal = Math.max(5, Math.min(100, dailyGoal + parseInt(b.dataset.goal))); localStorage.setItem("kore_goal", dailyGoal); renderApp(); }));
            $$("[data-practice]").forEach(b => b.addEventListener("click", () => { studyMode = "custom"; selectedPhasesCustom = [parseInt(b.dataset.practice)]; localStorage.setItem("kore_studymode", studyMode); localStorage.setItem("kore_custom_phases", JSON.stringify(selectedPhasesCustom)); currentView = "home"; renderApp(); window.scrollTo(0, 0); }));
            on("#clearHistoryBtn", "click", () => { if (confirm("¿Borrar todo el historial de sesiones?")) { stats.history = []; saveStats(); renderApp(); } });
            on("#modeSeqBtn", "click", () => { studyMode = "sequential"; localStorage.setItem("kore_studymode", studyMode); renderApp(); });
            on("#modeCustomBtn", "click", () => { studyMode = "custom"; localStorage.setItem("kore_studymode", studyMode); renderApp(); });
            $$(".custom-phase-chk").forEach(chk => {
                chk.addEventListener("change", () => {
                    selectedPhasesCustom = Array.from($$(".custom-phase-chk:checked")).map(c => parseInt(c.value));
                    localStorage.setItem("kore_custom_phases", JSON.stringify(selectedPhasesCustom));
                    renderApp();
                });
            });
            on("#closeWardrobeBtn", "click", closeWardrobeAndRevertSandbox);
            on("#startExamBtn", "click", startExamSession);
            on("#startExamBtn2", "click", startExamSession);
            $$("#wardrobeCatTabs button").forEach(tab => {
                tab.addEventListener("click", () => {
                    $$("#wardrobeCatTabs button").forEach(t => {
                        t.className = "shrink-0 px-3.5 py-2 rounded-lg text-xs font-medium bg-[#000000] border border-[#1C1C1C] text-slate-400 hover:text-white";
                    });
                    tab.className = "shrink-0 px-3.5 py-2 rounded-lg text-xs font-medium bg-sky-500 text-slate-950";
                    currentWardrobeCat = tab.dataset.wcat;
                    renderWardrobeModal();
                });
            });
            on("#sandboxUnlockToggle", "change", e => {
                sandboxUnlockAll = e.target.checked;
                renderWardrobeModal();
            });
            on("#randomOutfitBtn", "click", () => {
                const rank = getRankObj(userXp);
                catList.forEach(cat => {
                    const available = WARDROBE_ITEMS.filter(it => it.cat === cat && (sandboxUnlockAll || it.reqLvl <= rank.lvl));
                    if (available.length > 0) {
                        const randomItem = available[Math.floor(Math.random() * available.length)];
                        if (sandboxUnlockAll) previewEquipped[cat] = randomItem.id;
                        else {
                            equipped[cat] = randomItem.id;
                            previewEquipped[cat] = randomItem.id;
                        }
                    }
                });
                if (!sandboxUnlockAll) localStorage.setItem("kore_equipped", JSON.stringify(equipped));
                renderWardrobeModal();
            });
            on("#unequipAllBtn", "click", () => {
                catList.forEach(cat => {
                    if (sandboxUnlockAll) previewEquipped[cat] = null;
                    else {
                        equipped[cat] = null;
                        previewEquipped[cat] = null;
                    }
                });
                if (!sandboxUnlockAll) localStorage.setItem("kore_equipped", JSON.stringify(equipped));
                renderWardrobeModal();
            });
        }

        let currentWardrobeCat = "head";
        function sanitizeRealEquipped() {
            const lvl = getRankObj(userXp).lvl;
            let changed = false;
            Object.keys(equipped).forEach(cat => {
                const id = equipped[cat];
                if (!id) return;
                const it = WARDROBE_ITEMS.find(x => x.id === id);
                if (!it || it.reqLvl > lvl) {
                    equipped[cat] = null;
                    changed = true;
                }
            });
            if (changed) localStorage.setItem("kore_equipped", JSON.stringify(equipped));
            return equipped;
        }

        function renderWardrobeModal() {
            sanitizeRealEquipped();
            const rank = getRankObj(userXp);
            const doc = DOCTORS[activeDocId];
            const activeOutfit = sandboxUnlockAll ? previewEquipped : equipped;

            $("#wardrobePreviewStage").innerHTML = renderCharacterSVG(activeDocId, activeOutfit, false, "idle");
            $("#wardrobeDocName").textContent = `${doc.name} (${doc.species})`;
            $("#wardrobeUnlockStat").textContent = sandboxUnlockAll
                ? `Modo Probador Activo · Reales desbloqueados: ${WARDROBE_ITEMS.filter(it=>it.reqLvl<=rank.lvl).length}/120`
                : `${WARDROBE_ITEMS.filter(it=>it.reqLvl<=rank.lvl).length} de 120 prendas desbloqueadas (Nivel ${rank.lvl})`;

            $("#wardrobePreviewNotice").hidden = !sandboxUnlockAll;

            const items = WARDROBE_ITEMS.filter(it => it.cat === currentWardrobeCat);
            $("#wardrobeItemsGrid").innerHTML = items.map(it => {
                const isTrulyUnlocked = rank.lvl >= it.reqLvl;
                const canInteract = isTrulyUnlocked || sandboxUnlockAll;
                const isEq = activeOutfit[it.cat] === it.id;
                let statusLabel = `🔒 Nivel ${it.reqLvl}`;
                if (isTrulyUnlocked) statusLabel = isEq ? "✓ Equipado" : "Disponible";
                else if (sandboxUnlockAll) statusLabel = isEq ? "👁 En Probador" : `👁 Probar (Nvl ${it.reqLvl})`;

                const rar = getRarity(it);
                return `
                    <button type="button" class="w-item-btn ${isEq ? 'equipped' : ''} ${canInteract ? '' : 'locked'}" data-itemid="${it.id}" style="--rc:${rar.c}">
                        <div class="w-item-thumb">${renderWardrobeItemThumbnailSVG(it)}</div>
                        <span class="w-item-rar">${rar.k}</span>
                        <span class="w-item-name">${it.name}</span>
                        <span class="w-item-req text-[10px]">${statusLabel}</span>
                    </button>
                `;
            }).join("");

            $$("#wardrobeItemsGrid .w-item-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    const it = WARDROBE_ITEMS.find(x => x.id === btn.dataset.itemid);
                    if (!it) return;
                    const isTrulyUnlocked = rank.lvl >= it.reqLvl;
                    
                    if (isTrulyUnlocked) {
                        const nextVal = equipped[it.cat] === it.id ? null : it.id;
                        equipped[it.cat] = nextVal;
                        previewEquipped[it.cat] = nextVal;
                        localStorage.setItem("kore_equipped", JSON.stringify(equipped));
                    } else if (sandboxUnlockAll) {
                        previewEquipped[it.cat] = previewEquipped[it.cat] === it.id ? null : it.id;
                    }
                    renderWardrobeModal();
                });
            });
        }

        function openWardrobeWithCleanPreview() {
            sanitizeRealEquipped();
            sandboxUnlockAll = false;
            $("#sandboxUnlockToggle").checked = false;
            previewEquipped = { ...equipped };
            renderWardrobeModal();
            $("#wardrobeModal").hidden = false;
        }

        function closeWardrobeAndRevertSandbox() {
            sandboxUnlockAll = false;
            $("#sandboxUnlockToggle").checked = false;
            // Solo se guardan ítems legítimamente desbloqueados
            const lvl = getRankObj(userXp).lvl;
            Object.keys(previewEquipped).forEach(cat => {
                const id = previewEquipped[cat];
                if (id) {
                    const it = WARDROBE_ITEMS.find(x => x.id === id);
                    if (it && it.reqLvl <= lvl) {
                        equipped[cat] = id;
                    }
                }
            });
            localStorage.setItem("kore_equipped", JSON.stringify(equipped));
            previewEquipped = { ...equipped };
            $("#wardrobeModal").hidden = true;
            renderApp();
        }

        let examDeck = [];
        let examIdx = 0;
        let examScore = 0;
        let examPts = 0;
        let examResults = [];
        let selectedOptionsSet = new Set();

        function shuffleQuestionOptions(q) {
            if (q.type === "open" || q.options.some(o => /anteriores|cualquiera de las/i.test(o))) return;
            const idx = q.options.map((_, i) => i);
            for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
            q.options = idx.map(i => q.options[i]);
            q.correct = q.correct.map(c => idx.indexOf(c));
        }

        function startExamSession() {
            QUESTIONS_DB.forEach(shuffleQuestionOptions);
            if (studyMode === "sequential") {
                examDeck = [...QUESTIONS_DB].sort((a, b) => a.phase - b.phase);
            } else {
                examDeck = QUESTIONS_DB.filter(q => selectedPhasesCustom.includes(q.phase)).sort((a, b) => a.phase - b.phase);
                if (examDeck.length === 0) examDeck = [...QUESTIONS_DB];
            }
            examIdx = 0;
            examScore = 0; examPts = 0; examResults = [];
            renderExamView();
        }

        function renderExamView() {
            const q = examDeck[examIdx];
            if (!q) {
                renderExamSummary();
                return;
            }
            selectedOptionsSet.clear();
            const doc = DOCTORS[activeDocId];

            const container = $("#appContainer");
            container.innerHTML = `
                <div class="flex-1 flex flex-col lg:flex-row min-h-screen lg:h-screen lg:overflow-hidden bg-[#000000]">
                    <!-- VISTA CONCENTRADA DEL PROFESOR (IZQUIERDA) -->
                    <div class="w-full lg:w-96 xl:w-[26rem] border-b lg:border-b-0 lg:border-r border-[#1C1C1C] bg-[#0A0A0A] p-4 sm:p-6 gap-3 flex flex-col items-center justify-between animate-fade-in">
                        <div class="w-full flex items-center justify-between">
                            <span class="text-xs uppercase tracking-wider text-slate-500 font-medium">Elenchus · Pregunta ${examIdx + 1} de ${examDeck.length}</span>
                            <button id="exitExamBtn" class="text-xs text-slate-400 hover:text-white px-3 py-1 rounded-lg bg-[#000000] border border-[#1C1C1C]">Abandonar</button>
                        </div>
                        
                        <div class="flex flex-col items-center text-center my-auto">
                            <div id="focusAvatarStage" class="avatar-fit w-28 h-28 sm:w-36 sm:h-36 lg:w-44 lg:h-44 my-3 flex items-center justify-center bg-[#000000] rounded-full border border-[#1C1C1C] shadow-inner" data-doc="${activeDocId}" data-streak-tier="${streak >= 6 ? 3 : streak >= 4 ? 2 : streak >= 2 ? 1 : 0}">
                                <div id="focusAvatarMount" class="w-full h-full">${renderCharacterSVG(activeDocId, equipped, isMoyinSleeping, currentMood, streak)}</div>
                            </div>
                            <h3 id="focusDocName" class="font-serif-kore text-lg font-medium text-white">${doc.name}</h3>
                            <p id="focusDocRank" class="text-xs text-sky-400 font-medium mb-3">${doc.species}</p>
                            
                            <div id="moyinDrowsyWrap" class="w-full bg-[#000000] border border-[#1C1C1C] p-3 rounded-xl mb-3 ${activeDocId === 'moyin' ? '' : 'hidden'}">
                                <div class="flex justify-between text-[11px] text-slate-400 mb-1">
                                    <span>Vigilia de Moyin</span>
                                    <span id="moyinTimerVal">18s</span>
                                </div>
                                <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                                    <div id="moyinTimerBar" class="bg-amber-500 h-full w-full transition-all duration-1000"></div>
                                </div>
                            </div>

                            <div id="focusSpeechBubble" class="bg-[#000000] border border-[#1C1C1C] p-3.5 rounded-xl text-xs text-slate-300 italic w-full">
                                "${doc.greeting(userName)}"
                            </div>
                        </div>

                        <div class="w-full flex gap-2">
                            <button id="hintExamBtn" class="flex-1 bg-[#1C1C1C] hover:bg-slate-800 text-white text-xs py-2.5 rounded-xl border border-slate-700/50">💡 Pista</button>
                        </div>
                    </div>

                    <!-- LIENZO DE EVALUACIÓN CONCENTRADA (DERECHA) -->
                    <div class="flex-1 w-full p-4 sm:p-6 lg:p-12 lg:overflow-y-auto flex flex-col justify-center max-w-5xl mx-auto animate-fade-in">
                        <div class="mb-2 flex items-center justify-between">
                            <span class="text-xs text-sky-400 font-medium uppercase tracking-wider">Fase ${q.phase} · ${PHASE_NAMES[q.phase]}</span>
                            <button id="toggleSourceBtn" class="text-[11px] bg-[#0A0A0A] border border-[#1C1C1C] hover:border-slate-700 px-3 py-1.5 rounded-lg text-slate-400 flex items-center gap-1.5">
                                <span>📖</span> <span>Ver fuente</span>
                            </button>
                        </div>
                        <div id="sourceCard" class="bg-[#0A0A0A] border border-[#1C1C1C] p-3.5 rounded-xl text-xs text-slate-400 mb-4 hidden">
                            <span class="font-medium text-slate-300">Fuente oficial:</span> ${q.source}
                        </div>
                        
                        <div class="flex flex-wrap gap-2 mb-4">
                            <span class="kq-badge">${q.type === 'single' ? 'Opción única' : q.type === 'multiple' ? 'Selección múltiple' : 'Desarrollo'}</span>
                            <span class="kq-badge">${q.pts} ${q.pts === 1 ? 'punto' : 'puntos'}</span>
                        </div>
                        <h2 class="font-serif-kore text-xl md:text-2xl lg:text-3xl font-light text-white mb-6 leading-relaxed">${q.q}</h2>

                        ${q.type === 'multiple' ? `
                            <p class="text-xs text-slate-400 mb-4 italic">Se considera correcta si se elige el número exacto de respuestas válidas.</p>
                        ` : q.type === 'open' ? '' : `
                            <p class="text-xs text-slate-400 mb-4 italic">Elegí una sola respuesta.</p>
                        `}

                        ${q.type === 'open' ? `
                            <textarea id="openAnswer" placeholder="Escribí tu respuesta como la entregarías en el parcial..." class="w-full min-h-[170px] bg-[#0A0A0A] border border-[#1C1C1C] focus:border-sky-500 outline-none rounded-xl p-4 text-sm text-slate-200 mb-6 resize-y"></textarea>
                            <div class="flex justify-end" id="openActions">
                                <button id="revealModelBtn" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold px-8 py-3.5 rounded-xl text-sm">Comparar con la respuesta modelo</button>
                            </div>
                        ` : `
                            <div class="flex flex-col gap-3 mb-8" id="optionsContainer">
                                ${q.options.map((opt, idx) => `
                                    <button type="button" class="opt-btn text-left p-4 rounded-xl border border-[#1C1C1C] bg-[#0A0A0A] hover:border-sky-500 flex items-center gap-3 text-sm text-slate-200" data-idx="${idx}">
                                        <span class="opt-mark w-6 h-6 shrink-0 ${q.type === 'multiple' ? 'rounded-md' : 'rounded-full'} bg-[#000000] border border-[#2a2a2a] flex items-center justify-center text-xs font-semibold text-sky-400">${String.fromCharCode(65 + idx)}</span>
                                        <span class="flex-1">${opt}</span>
                                    </button>
                                `).join("")}
                            </div>
                            <div class="flex justify-end" id="submitWrap">
                                <button id="submitAnswerBtn" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold px-8 py-3.5 rounded-xl text-sm" disabled>Confirmar respuesta</button>
                            </div>
                        `}
                        <div id="feedbackArea" class="mt-6"></div>
                    </div>
                </div>
            `;

            bindExamEvents(q);
            if (q.type === 'open') clearInterval(moyinInterval); else startMoyinTimer();
        }

        function startMoyinTimer() {
            clearInterval(moyinInterval);
            if (activeDocId !== "moyin") return;
            moyinAwakeSeconds = 18;
            isMoyinSleeping = false;
            
            moyinInterval = setInterval(() => {
                moyinAwakeSeconds--;
                if (moyinAwakeSeconds === 5 && currentMood !== "sleeping") docSpeakFocus("Ay... qué sueño... *bostezo*", "drowsy");
                const bar = $("#moyinTimerBar");
                const val = $("#moyinTimerVal");
                if (bar && val) {
                    const pct = Math.max(0, (moyinAwakeSeconds / 18) * 100);
                    bar.style.width = pct + "%";
                    val.textContent = moyinAwakeSeconds + "s";
                }
                if (moyinAwakeSeconds <= 0) {
                    clearInterval(moyinInterval);
                    isMoyinSleeping = true;
                    currentMood = "sleeping";
                    docSpeakFocus("Dr. Moyin se ha quedado dormido esperando tu respuesta...", "sleeping");
                }
            }, 1000);
        }

        function resetMoyinTimer() {
            if (activeDocId === "moyin" && currentMood === "drowsy") { currentMood = "idle"; docSpeakFocus("¡Presente! Estaba meditando.", "idle"); }
            if (activeDocId === "moyin" && isMoyinSleeping) {
                isMoyinSleeping = false;
                currentMood = "idle";
                docSpeakFocus("¡Dr. Moyin despertó con el café y la respuesta!", "happy");
            }
            startMoyinTimer();
        }

        function docSpeakFocus(text, mood = "idle") {
            currentMood = mood;
            const stage = $("#focusAvatarStage");
            const bubble = $("#focusSpeechBubble");
            if (stage) stage.setAttribute("data-mood", mood);
            if (bubble) bubble.textContent = `"${text}"`;
            const mount = $("#focusAvatarMount");
            if (mount) mount.innerHTML = renderCharacterSVG(activeDocId, equipped, isMoyinSleeping, mood, streak);
        }

        function bindExamEvents(q) {
            $("#exitExamBtn").addEventListener("click", () => {
                clearInterval(moyinInterval);
                renderApp();
            });

            $("#toggleSourceBtn").addEventListener("click", () => {
                const src = $("#sourceCard");
                src.hidden = !src.hidden;
            });

            $("#hintExamBtn").addEventListener("click", () => {
                resetMoyinTimer();
                const doc = DOCTORS[activeDocId];
                docSpeakFocus(doc.hint(userName, q.source), "thinking");
            });

            $$(".opt-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    resetMoyinTimer();
                    const idx = parseInt(btn.dataset.idx);
                    const doc = DOCTORS[activeDocId];

                    if (q.type === "multiple") {
                        if (selectedOptionsSet.has(idx)) selectedOptionsSet.delete(idx);
                        else selectedOptionsSet.add(idx);
                        
                        btn.classList.toggle("border-sky-500", selectedOptionsSet.has(idx));
                        btn.classList.toggle("bg-sky-500/10", selectedOptionsSet.has(idx));
                        
                        $("#submitAnswerBtn").disabled = selectedOptionsSet.size === 0;
                    } else {
                        selectedOptionsSet.clear();
                        selectedOptionsSet.add(idx);
                        $$(".opt-btn").forEach(b => {
                            b.classList.remove("border-sky-500", "bg-sky-500/10");
                        });
                        btn.classList.add("border-sky-500", "bg-sky-500/10");
                        $("#submitAnswerBtn").disabled = false;
                        docSpeakFocus(doc.selectOpt(userName, String.fromCharCode(65 + idx)), "thinking");
                    }
                });
            });

            function finishQuestion(earned, userArr) {
                clearInterval(moyinInterval);
                const doc = DOCTORS[activeDocId];
                const status = earned >= q.pts ? "ok" : earned > 0 ? "part" : "bad";
                const xpBefore = userXp;
                examPts += earned;
                examResults.push({ q, earned, status });
                if (status === "ok") {
                    examScore++; userXp += Math.round(q.pts * 30); streak++;
                    docSpeakFocus(doc.correct(userName), "happy");
                } else if (status === "part") {
                    userXp += Math.round(earned * 30); streak = 0;
                    docSpeakFocus("Vas bien encaminado, " + (userName || "estudiante") + ", pero te faltó precisión.", "thinking");
                } else {
                    streak = 0;
                    docSpeakFocus(doc.incorrect(userName), "angry");
                }
                localStorage.setItem("kore_xp", userXp);
                localStorage.setItem("kore_streak", streak);
                recordQuestion(q, status, userXp - xpBefore);
                const label = status === "ok" ? "Correcto" : status === "part" ? "Parcial" : "Incorrecto";
                const icon = status === "ok" ? "✓" : status === "part" ? "◐" : "✕";
                const last = examIdx + 1 >= examDeck.length;
                $("#feedbackArea").innerHTML = `
                    <div class="flex items-center justify-between gap-4 flex-wrap kq-feedback">
                        <span class="kq-pill kq-${status}"><b>${icon} ${label}</b><span>${earned}/${q.pts} ${q.pts === 1 ? "Punto" : "Puntos"}</span></span>
                        <button id="nextQBtn" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold px-8 py-3 rounded-xl text-sm">${last ? "Ver resultado" : "Siguiente"} →</button>
                    </div>`;
                $("#nextQBtn").addEventListener("click", () => { examIdx++; renderExamView(); });
            }

            if (q.type === "open") {
                $("#revealModelBtn").addEventListener("click", () => {
                    $("#openAnswer").readOnly = true;
                    $("#openActions").hidden = true;
                    $("#feedbackArea").innerHTML = `
                        <div class="kq-model">
                            <div class="text-xs uppercase tracking-wider text-slate-400 mb-2">Respuesta modelo</div>
                            <p class="text-sm text-slate-200 leading-relaxed mb-4">${q.model}</p>
                            <div class="text-xs uppercase tracking-wider text-slate-400 mb-2">El profe suele buscar</div>
                            <ul class="text-sm text-slate-300 mb-5 list-disc pl-5 space-y-1">${q.rubric.map(r => `<li>${r}</li>`).join("")}</ul>
                            <div class="text-xs text-slate-400 mb-3">Autoevaluate con honestidad, como lo haría el profe:</div>
                            <div class="flex gap-3 flex-wrap" id="gradeBtns">
                                <button data-g="1" class="kq-grade kq-g-ok">Lo tenía completo</button>
                                <button data-g="0.5" class="kq-grade kq-g-part">Lo tenía a medias</button>
                                <button data-g="0" class="kq-grade kq-g-bad">No lo tenía</button>
                            </div>
                        </div>`;
                    $$("#gradeBtns button").forEach(gb => gb.addEventListener("click", () => {
                        const earned = Math.round(q.pts * parseFloat(gb.dataset.g) * 100) / 100;
                        $("#gradeBtns").hidden = true;
                        finishQuestion(earned, []);
                    }));
                });
                return;
            }

            $("#submitAnswerBtn").addEventListener("click", () => {
                const userArr = Array.from(selectedOptionsSet).sort((x, y) => x - y);
                const correctArr = [...q.correct].sort((x, y) => x - y);
                const isCorrect = userArr.length === correctArr.length && userArr.every((v, i) => v === correctArr[i]);
                $("#submitWrap").hidden = true;
                $$(".opt-btn").forEach((b, i) => {
                    const isC = q.correct.includes(i), isU = userArr.includes(i);
                    const cls = isC && isU ? "opt-ok" : (!isC && isU) ? "opt-wrong" : isC ? "opt-missed" : "opt-dim";
                    b.style.setProperty("--rd", (i * 110) + "ms");
                    b.classList.add("opt-locked", cls);
                    const mark = b.querySelector(".opt-mark");
                    if (cls !== "opt-dim") setTimeout(() => { mark.textContent = (cls === "opt-wrong") ? "✕" : "✓"; mark.classList.add("mark-pop"); }, i * 110 + 250);
                });
                setTimeout(() => finishQuestion(isCorrect ? q.pts : 0, userArr), q.options.length * 110 + 350);
            });
        }

        function renderExamSummary() {
            const container = $("#appContainer");
            const maxPts = examDeck.reduce((t, q) => t + q.pts, 0);
            const nota = Math.round((examPts / maxPts) * 100) / 10;
            const ok = nota >= APPROVE_MARK;
            if (!examDeck._rec) { examDeck._rec = true; recordSession(nota, ok, Math.round(examPts * 100) / 100, maxPts, examResults.length, Math.round(examResults.reduce((t, r) => t + r.earned, 0) * 30)); }
            container.innerHTML = `
                <div class="flex-1 flex flex-col items-center p-4 sm:p-6 py-10 sm:py-14 text-center max-w-3xl mx-auto w-full">
                    <h2 class="font-serif-kore text-3xl sm:text-4xl font-light mb-3 text-white">Sesión de Elenchus concluida</h2>
                    <p class="text-slate-400 text-sm mb-8">Evaluada con el criterio de la cátedra: nota sobre 10, aprobación con ${APPROVE_MARK}.</p>
                    <div class="bg-[#0A0A0A] border border-[#1C1C1C] p-8 rounded-3xl w-full mb-8">
                        <div class="text-xs uppercase tracking-wider text-slate-400 mb-2">Puntos</div>
                        <div class="font-serif-kore text-6xl font-light ${ok ? 'text-emerald-300' : 'text-rose-300'} mb-2">${nota}<span class="text-2xl text-slate-500">/10</span></div>
                        <div class="kq-pill ${ok ? 'kq-ok' : 'kq-bad'} mx-auto"><b>${ok ? '✓ Aprobado' : '✕ Desaprobado'}</b><span>${examPts}/${maxPts} pts</span></div>
                    </div>
                    <div class="w-full text-left flex flex-col gap-3 mb-8">
                        ${examResults.map(r => `
                            <div class="flex items-start gap-3 bg-[#0A0A0A] border border-[#1C1C1C] rounded-xl p-3">
                                <span class="kq-pill kq-${r.status} shrink-0"><b>${r.status === 'ok' ? '✓ Correcto' : r.status === 'part' ? '◐ Parcial' : '✕ Incorrecto'}</b><span>${r.earned}/${r.q.pts}</span></span>
                                <span class="text-xs text-slate-400 leading-relaxed">${r.q.q.length > 120 ? r.q.q.slice(0, 120) + '…' : r.q.q}</span>
                            </div>`).join("")}
                    </div>
                    <button id="backToStoaBtn" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold px-8 py-3.5 rounded-xl">Volver a la Stoa</button>
                </div>`;
            $("#backToStoaBtn").addEventListener("click", renderApp);
        }

        window.onload = function () {
            renderApp();
        };

        (function () {
            const SEL = 'h1,h2,h3,h4,p,.doc-card,.opt-btn,button,input,label,#avatarStage,#focusAvatarStage,#focusSpeechBubble';
            function splitWords(el) {
                if (el.dataset.kw) return;
                el.dataset.kw = "1";
                let n = 0;
                const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
                const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
                nodes.forEach(tn => {
                    if (!tn.textContent.trim()) return;
                    const frag = document.createDocumentFragment();
                    tn.textContent.split(/(\s+)/).forEach(part => {
                        if (!part) return;
                        if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(" ")); return; }
                        const sp = document.createElement("span");
                        sp.className = "kw"; sp.style.setProperty("--w", n++); sp.textContent = part;
                        frag.appendChild(sp);
                    });
                    tn.replaceWith(frag);
                });
            }
            function koreReveal() {
                const c = document.getElementById("appContainer"); if (!c) return;
                const els = [...c.querySelectorAll(SEL)].filter(el => {
                    if (el.closest("svg") || el.closest("#wardrobeModal")) return false;
                    const par = el.parentElement && el.parentElement.closest(SEL);
                    return !(par && c.contains(par));
                });
                els.forEach((el, i) => {
                    el.style.setProperty("--d", Math.min(i, 26) * 55);
                    if (/^H[12]$/.test(el.tagName)) splitWords(el); else el.classList.add("k-rise");
                });
            }
            const c = document.getElementById("appContainer");
            if (c) { new MutationObserver(koreReveal).observe(c, { childList: true }); koreReveal(); }
        })();

    </script>
</body>
</html>
